<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @layer fonts, main;

        @import "https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=block" layer(fonts);
        @import "https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=upload" layer(fonts);
        @import "static/main.css" layer(main);
    </style>
</head>
<body>
    <header>
        <div class="appbar">
            <h1>Mincing Words</h1>
        </div>
    </header>
    <main id="main-content" class="column">
        <section id="top-section" class="top-section primary-container column">
            <h2 class="limited-width-column">
                <strong>
                    Struggling with parsing out customer requirements for your software?
                    Upload the customer-provided document & let AI chop it up for you!
                </strong>
            </h2>

            <svg
                class="primary-container-waves"
                xmlns="http://www.w3.org/2000/svg"
                version="1.1"
                viewBox="0 0 1440 320"
                preserveAspectRatio="none">
                <!-- Path generated with https://getwaves.io/ -->
                <path
                        stroke="none"
                        d="M0,128L48,112C96,96,192,64,288,74.7C384,85,480,139,576,149.3C672,160,768,128,864,96C960,64,1056,32,1152,32C1248,32,1344,64,1392,80L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"/>
            </svg>
        </section>

        <section class="bottom-section column weak-text">
            <h3>
                <span class="material-symbols-rounded">upload</span>
            </h3>

            <div class="column">
                <h3 class="limited-width-column">
                    Drop the PDF here & get a cleaned up version.
                </h3>
            </div>
        </section>
    </main>

    <input type="file" id="file-picker" accept="application/pdf">
    <script type="module" src="static/main.js"></script>
</body>
</html>
